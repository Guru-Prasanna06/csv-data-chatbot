version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/csvgraphdb
      NEO4J_dbms_default__database: CSV_Graph_DB
      NEO4J_initial_dbms_default__database: CSV_Graph_DB
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p csvgraphdb -d CSV_Graph_DB 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build:
      context: ./loader
      dockerfile: Dockerfile
    container_name: csv-neo4j-loader
    user: "10001:10001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: csvgraphdb
      NEO4J_DATABASE: CSV_Graph_DB
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: csv-rows
      KAFKA_GROUP_ID: csv-neo4j-loader
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: on-failure
